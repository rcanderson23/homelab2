apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  name: mcp-grafana
  namespace: argocd
spec:
  sources:
  - repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana-mcp
    targetRevision: 0.27.2
    helm:
      valueFiles:
      - $values/argocd/apps/observability/mcp-grafana/values.yaml
  - repoURL: 'https://github.com/rcanderson23/homelab2.git'
    targetRevision: main
    ref: values
  - repoURL: 'https://github.com/rcanderson23/homelab2.git'
    path: 'argocd/apps/observability/mcp-grafana/manifests'
    targetRevision: main
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
