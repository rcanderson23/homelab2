roles: "kube,app"
proxyAddr: "carson-beams.beams.sh:443"
enterprise: true
joinParams:
  method: "iam"
  tokenName: "iam-token"
kubeClusterName: "homelab"
highAvailability:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
podMonitor:
  enabled: true
  additionalLabels:
    release: kps
apps:
- name: grafana
  uri: http://grafana.grafana.svc.cluster.local.:80
  public_addr: grafana.carson-beams.beams.sh
  rewrite:
    headers:
    - "Origin: https://grafana.carson-beams.beams.sh"
    - "Host: grafana.carson-beams.beams.sh"
  labels:
    env: homelab
    category: monitoring
- name: prometheus
  uri: http://kps-prometheus.monitoring.svc.cluster.local.:9090
  labels:
    env: homelab
    category: monitoring
- name: loki
  uri: http://loki-headless.loki.svc.cluster.local.:3100
  labels:
    env: homelab
    category: monitoring
- name: alertmanager
  uri: http://kps-alertmanager.monitoring.svc.cluster.local.:9093
  labels:
    env: homelab
    category: monitoring
- name: argocd
  uri: http://argocd-server.argocd.svc.cluster.local.:443
  labels:
    env: homelab
    category: cd
- name: longhorn
  uri: http://longhorn-frontend.longhorn-system.svc.cluster.local.:80
  labels:
    env: homelab
    category: storage

clusterDomain: "cluster.local"
updater:
  enabled: false
podSecurityPolicy:
  enabled: false
log:
  format: json
