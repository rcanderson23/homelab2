---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lunch-messenger
spec:
  schedule: "0 16 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: lunch-messenger
            image: ghcr.io/rcanderson23/lunch-messenger:latest@sha256:a2f4038a02a644c3701d8a40533975111357234a4020e978b30441f5874ccd38
            envFrom:
            - secretRef:
                name: pushover-credentials
          restartPolicy: OnFailure
