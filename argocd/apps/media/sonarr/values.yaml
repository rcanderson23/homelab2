global:
  fullnameOverride: sonarr
controllers:
  sonarr:
    enabled: true
    type: statefulset
    replicas: 1
    statefulset:
      volumeClaimTemplates:
        - name: config
          accessMode: ReadWriteOnce
          size: 2Gi
          storageClass: longhorn
          globalMounts:
            - path: /config

    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 100
        fsGroupChangePolicy: "OnRootMismatch"
    containers:
      app:
        image:
          repository: ghcr.io/onedr0p/sonarr
          tag: 4.0.12.2823@sha256:55c6878a5367fc2398d15c9a16a70653f5e5f42c9fe9b708a038f2781fb0360f
          pullPolicy: IfNotPresent
        env:
          TZ: "${TZ}"
          SONARR__INSTANCE_NAME: sonarr
          SONARR__PORT: &port 8989
          SONARR__APPLICATION_URL: "https://sonarr.carsonanderson.net"
          SONARR__AUTHENTICATION_METHOD: External
          SONARR__AUTHENTICATION_REQUIRED: DisabledForLocalAddresses
          SONARR__THEME: dark
          SONARR__LOG_LEVEL: info
        probes:
          liveness:
            enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 14m
            memory: 256Mi
service:
  app:
    primary: true
    controller: sonarr
    ports:
      http:
        port: *port
persistence:
  data:
    enabled: true
    type: nfs
    server: "nas.carsonanderson.net"
    path: /volume1/nfs
